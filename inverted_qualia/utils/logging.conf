[loggers]
keys=root

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=baseFormatter,cliFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler,fileHandler

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=cliFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=DEBUG
formatter=baseFormatter
args=(r'%(logfilename)s','a+')


[formatter_baseFormatter]
format=%(asctime)s - %(relativeCreated)d - %(name)s - %(levelname)s : Line %(lineno)s - %(message)s
datefmt=%Y%m%d %H:%M:%S


[formatter_cliFormatter]
format=%(name)s - %(levelname)s : %(message)s
datefmt=%Y%m%d %H:%M:%S
